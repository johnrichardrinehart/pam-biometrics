[workspace]
resolver = "3"
members = ["crates/daemon", "crates/face", "crates/policy", "crates/protocol"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["John Rinehart"]
repository = "https://github.com/johnrichardrinehart/pam-biometrics"

[workspace.dependencies]
pam-biometrics-face = { path = "crates/face" }
pam-biometrics-policy = { path = "crates/policy" }
pam-biometrics-protocol = { path = "crates/protocol" }


boon = "0.6"
clap = { version = "4", features = ["derive"] }
cxx = "1"
cxx-build = "1"
nix = { version = "0.31", features = ["fs", "signal", "socket", "user"] }
pkg-config = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
# Doc comments of the CLI are help text. Markdown backticks would show there.
doc_markdown = "allow"
